name: Garmin branch compile check

on:
  push:
    branches:
      - feature/garmin-watch

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test Mmolio delivery routing
        run: bash tests/garmin-delivery/run.sh
      - name: Test Dexcom G7 sensor trend packets
        run: bash tests/g7-trend/run.sh
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project xdrip.xcodeproj -scheme xdrip
      - name: Compile xDrip without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project xdrip.xcodeproj \
            -scheme xdrip \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Test G7 trend storage and model migration
        run: |
          set -o pipefail
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; groups=json.load(sys.stdin)["devices"]; print(next((d["udid"] for devices in groups.values() for d in devices if "iPhone" in d["name"]), ""))')"
          test -n "$simulator_id"
          xcodebuild \
            -project xdrip.xcodeproj \
            -scheme xdrip \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -only-testing:xdripTests/BgReadingTrendTests/testSensorTrendOverridesCalculatedSlopeForDisplayAndGarmin \
            -only-testing:xdripTests/BgReadingTrendTests/testMissingG7TrendNeverLooksFlat \
            -only-testing:xdripTests/BgReadingTrendTests/testV31ToV32LightweightMappingCanBeInferred \
            -only-testing:xdripTests/DexcomG7CalibrationTests/testBothG7PacketModesReadTheSensorTrend \
            -only-testing:xdripTests/DexcomG7CalibrationTests/testSensorTrendCategoriesFollowDexcomRateBands \
            CODE_SIGNING_ALLOWED=NO \
            test
