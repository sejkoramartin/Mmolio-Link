name: Mmolio Link compile check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test Mmolio delivery routing
        run: bash tests/garmin-delivery/run.sh
      - name: Test Dexcom G7 sensor trend packets
        run: bash tests/g7-trend/run.sh
      - name: Test Core Data trend migration
        run: bash tests/g7-trend/migration.sh
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project xdrip.xcodeproj -scheme xdrip
      - name: Compile Mmolio Link without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project xdrip.xcodeproj \
            -scheme xdrip \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
